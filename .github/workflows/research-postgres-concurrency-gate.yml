name: N3XORA PostgreSQL Research concurrency gate

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/app/api/v1/research_workflow.py"
      - "backend/app/services/research_workflow_hfsm.py"
      - "backend/app/services/scientific_workflow_engine.py"
      - "backend/app/services/task_outbox.py"
      - "backend/app/models/research.py"
      - "backend/app/models/scientific_workflow.py"
      - "backend/app/models/workflow.py"
      - "backend/tests/conftest.py"
      - "backend/tests/test_research_postgres_gate.py"
      - ".github/workflows/research-postgres-concurrency-gate.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/api/v1/research_workflow.py"
      - "backend/app/services/research_workflow_hfsm.py"
      - "backend/app/services/scientific_workflow_engine.py"
      - "backend/app/services/task_outbox.py"
      - "backend/app/models/research.py"
      - "backend/app/models/scientific_workflow.py"
      - "backend/app/models/workflow.py"
      - "backend/tests/conftest.py"
      - "backend/tests/test_research_postgres_gate.py"
      - ".github/workflows/research-postgres-concurrency-gate.yml"

permissions:
  contents: read

jobs:
  postgres-research-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexora_ci
          POSTGRES_USER: nexora_ci
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora_ci -d nexora_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_NAME: N3XORA PostgreSQL Research Gate
      APP_VERSION: 2.0.0
      DEBUG: "true"
      DATABASE_URL: postgresql://nexora_ci:ci-only-postgres-password@localhost:5432/nexora_ci
      NEXORA_TEST_DATABASE_URL: postgresql://nexora_ci:ci-only-postgres-password@localhost:5432/nexora_ci
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      SECRET_KEY: ci-only-secret-key-with-more-than-32-characters-2026
      ADMIN_EMAIL: ci-admin@nexora.test
      AFRICAN_LIBS_DIR: /tmp/n3xora-african-libs
      OFFLINE_PACKAGES_DIR: /tmp/n3xora-offline-packages
      STORAGE_DIR: /tmp/n3xora-storage
      UPLOAD_DIR: /tmp/n3xora-storage/uploads
      RESULTS_DIR: /tmp/n3xora-storage/results
      TEMP_DIR: /tmp/n3xora-storage/temp
      AMRFINDER_REQUIRED: "false"
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: gemma2:2b
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile backend and PostgreSQL gate
        run: python -m compileall -q app tests
      - name: Run PostgreSQL concurrency tests
        run: pytest -q tests/test_research_postgres_gate.py
