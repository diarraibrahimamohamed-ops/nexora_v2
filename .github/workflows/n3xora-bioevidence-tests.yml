name: N3XORA-Sahel BioEvidence tests

on:
  push:
    branches:
      - main
      - feature/n3xora-sahel-bioevidence
      - feature/research-fsm-transactional-outbox
      - feature/experimental-evidence-validation
      - feature/experimental-analytics-engine-v1
      - integration/assay-statistics-4pl-validation-v1
      - security/hardening-deps-scientific-governance
      - feature/lcmsms-engine-phase1h
      - feature/lcmsms-validation-phase1i
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-research-gates:
    runs-on: ubuntu-latest
    env:
      APP_NAME: N3XORA CI
      APP_VERSION: 2.0.0
      DEBUG: "true"
      DATABASE_URL: sqlite:///./ci_nexora.db
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      SECRET_KEY: ci-only-secret-key-with-more-than-32-characters-2026
      ADMIN_EMAIL: ci-admin@nexora.test
      AFRICAN_LIBS_DIR: /tmp/n3xora-african-libs
      OFFLINE_PACKAGES_DIR: /tmp/n3xora-offline-packages
      STORAGE_DIR: /tmp/n3xora-storage
      UPLOAD_DIR: /tmp/n3xora-storage/uploads
      RESULTS_DIR: /tmp/n3xora-storage/results
      TEMP_DIR: /tmp/n3xora-storage/temp
      AMRFINDER_REQUIRED: "false"
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: gemma2:2b

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend requirements
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Compile Python source
        run: python -m compileall -q backend/app backend/tests

      - name: Run BioEvidence regression tests
        run: >-
          pytest -q
          backend/tests/test_phytochemistry.py
          backend/tests/test_lcmsms_api.py
          backend/tests/test_lcmsms_validation.py
          backend/tests/test_research_bioevidence.py
          backend/tests/test_amrfinder_readiness.py
          backend/tests/test_config_security.py
          backend/tests/test_heuristic_scientific_guards.py
          backend/tests/test_virtual_screening_phase7.py
          backend/tests/test_amrfinder_integration.py
          backend/tests/test_rna_structure_integration.py
          backend/tests/test_research_workflow_fsm.py
          backend/tests/test_research_workflow_fsm_api.py
          backend/tests/test_experimental_evidence.py
          backend/tests/test_experimental_analytics.py
          backend/tests/test_experimental_analytics_api.py
          backend/tests/test_assay_statistics.py
          backend/tests/test_assay_docking_comparison.py
          backend/tests/test_task_outbox.py
          backend/tests/test_scientific_workflow_core.py
          backend/tests/test_scientific_workflow_execution.py
          backend/tests/test_scientific_workflow_phase1d.py
          backend/tests/test_scientific_workflow_phase1e.py
          backend/tests/test_scientific_provenance.py
          backend/tests/test_structure_validation_phase3.py

      - name: Check shared and analytics JavaScript syntax
        run: |
          node --check frontend/js/api.js
          node --check frontend/js/research-analytics.js

      - name: Extract and check inline page scripts
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for source in ("frontend/research.html", "frontend/phytochemistry.html"):
              html = Path(source).read_text(encoding="utf-8")
              scripts = re.findall(r"<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>", html, re.I | re.S)
              if not scripts:
                  raise SystemExit(f"No inline script found in {source}")
              target = Path("/tmp") / (Path(source).stem + "-inline.js")
              target.write_text("\n".join(scripts), encoding="utf-8")
              print(f"Prepared {target}")
          PY
          node --check /tmp/research-inline.js
          node --check /tmp/phytochemistry-inline.js

      - name: Build backend Docker image including AMRFinderPlus
        run: docker build --build-arg INSTALL_AMRFINDERPLUS=true --build-arg AMRFINDERPLUS_VERSION=4.2.7 -t nexora-v2-ci:latest backend

      - name: Build isolated LC-MS/MS worker image
        run: docker build -f backend/Dockerfile.lcmsms --build-arg INSTALL_AMRFINDERPLUS=false -t nexora-v2-lcmsms-ci:latest backend

      - name: Validate Docker Compose configuration
        run: |
          cat > .env <<'EOF'
          DB_USER=nexora_ci
          DB_PASSWORD=ci-only-password-strong-enough
          DB_NAME=nexora_ci
          FLOWER_BASIC_AUTH=ci:ci-only-password
          DATABASE_URL=postgresql://nexora_ci:ci-only-password-strong-enough@db:5432/nexora_ci
          REDIS_URL=redis://redis:6379/0
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/1
          SECRET_KEY=ci-only-secret-key-with-more-than-32-characters-2026
          ADMIN_EMAIL=ci-admin@nexora.test
          EOF
          docker compose config --quiet

      - name: Validate Phase 1H to 1I PostgreSQL migrations
        run: |
          set -euo pipefail
          container=nexora-phase1i-postgres
          docker run --detach --name "$container" \
            -e POSTGRES_PASSWORD=ci-only-password \
            -e POSTGRES_DB=nexora_ci \
            postgres:16-alpine
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if docker exec "$container" pg_isready -U postgres -d nexora_ci; then
              break
            fi
            sleep 2
          done
          docker exec "$container" pg_isready -U postgres -d nexora_ci

          # Minimal Phase 1G fixture copied from the deployed LC-MS/MS DDL.
          # Avoid unrelated legacy init.sql dependencies outside this migration test.
          cat > /tmp/phase1g-lcmsms.sql <<'SQL'
          CREATE TABLE users (id SERIAL PRIMARY KEY);
          CREATE TABLE research_studies (
              id SERIAL PRIMARY KEY,
              user_id INT NOT NULL REFERENCES users(id)
          );
          CREATE TABLE scientific_workflow_runs (id SERIAL PRIMARY KEY);
          CREATE TABLE lcms_analytical_batches (
              id SERIAL PRIMARY KEY,
              study_id INT NOT NULL REFERENCES research_studies(id)
          );
          CREATE TABLE lcms_injections (
              id SERIAL PRIMARY KEY,
              study_id INT NOT NULL REFERENCES research_studies(id),
              batch_id INT NOT NULL REFERENCES lcms_analytical_batches(id),
              injection_order INT NOT NULL
          );
          CREATE TABLE lcms_data_artifacts (
              id SERIAL PRIMARY KEY,
              injection_id INT NOT NULL REFERENCES lcms_injections(id)
          );
          CREATE TABLE lcms_spectral_libraries (
              id SERIAL PRIMARY KEY,
              name VARCHAR(160) NOT NULL,
              version VARCHAR(120) NOT NULL,
              source_license VARCHAR(255) NOT NULL
          );
          CREATE TABLE lcms_processing_runs (
              id SERIAL PRIMARY KEY,
              study_id INT NOT NULL REFERENCES research_studies(id),
              batch_id INT NOT NULL REFERENCES lcms_analytical_batches(id),
              spectral_library_id INT REFERENCES lcms_spectral_libraries(id) ON DELETE SET NULL,
              software_name VARCHAR(160) NOT NULL,
              software_version VARCHAR(120) NOT NULL,
              workflow_name VARCHAR(160) NOT NULL,
              workflow_version VARCHAR(120),
              parameters JSONB NOT NULL DEFAULT '{}'::jsonb,
              input_sha256 VARCHAR(64) NOT NULL,
              output_sha256 VARCHAR(64),
              status VARCHAR(30) NOT NULL DEFAULT 'registered',
              started_at TIMESTAMP,
              completed_at TIMESTAMP,
              created_by INT REFERENCES users(id) ON DELETE SET NULL,
              provenance_manifest JSONB NOT NULL DEFAULT '{}'::jsonb,
              created_at TIMESTAMP NOT NULL DEFAULT NOW(),
              CONSTRAINT ck_lcms_processing_status CHECK(
                  status IN ('registered','processing','completed','failed')
              )
          );
          CREATE TABLE lcms_features (
              id SERIAL PRIMARY KEY,
              processing_run_id INT NOT NULL REFERENCES lcms_processing_runs(id) ON DELETE CASCADE,
              feature_key VARCHAR(120) NOT NULL,
              precursor_mz NUMERIC(18,8) NOT NULL,
              retention_time NUMERIC(18,8) NOT NULL,
              retention_time_unit VARCHAR(30) NOT NULL DEFAULT 'second',
              polarity VARCHAR(20) NOT NULL,
              charge INT,
              adduct VARCHAR(80),
              molecular_formula_candidate VARCHAR(160),
              isotope_group VARCHAR(120),
              quality_flags JSONB NOT NULL DEFAULT '[]'::jsonb,
              created_at TIMESTAMP NOT NULL DEFAULT NOW(),
              CONSTRAINT uq_lcms_feature_processing_key UNIQUE(processing_run_id, feature_key)
          );
          CREATE TABLE lcms_ms2_spectra (
              id SERIAL PRIMARY KEY,
              feature_id INT NOT NULL REFERENCES lcms_features(id) ON DELETE CASCADE,
              injection_id INT NOT NULL REFERENCES lcms_injections(id) ON DELETE CASCADE,
              artifact_id INT REFERENCES lcms_data_artifacts(id) ON DELETE SET NULL,
              scan_identifier VARCHAR(120),
              precursor_mz NUMERIC(18,8) NOT NULL,
              isolation_window NUMERIC(12,6),
              collision_energy NUMERIC(12,6),
              collision_energy_unit VARCHAR(40),
              polarity VARCHAR(20) NOT NULL,
              charge INT,
              fragments JSONB NOT NULL DEFAULT '[]'::jsonb,
              acquired_at TIMESTAMP,
              created_at TIMESTAMP NOT NULL DEFAULT NOW()
          );

          INSERT INTO users DEFAULT VALUES;
          INSERT INTO research_studies(user_id) VALUES (1);
          INSERT INTO lcms_analytical_batches(study_id) VALUES (1);
          INSERT INTO lcms_injections(study_id, batch_id, injection_order) VALUES (1, 1, 1);
          INSERT INTO lcms_processing_runs(
              study_id, batch_id, software_name, software_version,
              workflow_name, workflow_version, parameters, input_sha256,
              output_sha256, status, created_by
          ) VALUES (
              1, 1, 'OpenMS', '3.6.0', 'phase1g-fixture', '1.0.0', '{}'::jsonb,
              repeat('a', 64), repeat('b', 64), 'completed', 1
          );
          INSERT INTO lcms_features(
              processing_run_id, feature_key, precursor_mz, retention_time, polarity
          ) VALUES (1, 'FT-LEGACY-001', 301.1234, 10.0, 'positive');
          INSERT INTO lcms_ms2_spectra(
              feature_id, injection_id, scan_identifier, precursor_mz, polarity
          ) VALUES (1, 1, 'legacy-ms2-scan', 301.1234, 'positive');
          SQL

          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < /tmp/phase1g-lcmsms.sql

          # Upgrade the existing Phase 1G data model to the current Phase 1H shape.
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/20261101_lcmsms_phase1h_schema.sql

          # Apply the Phase 1I report migration, then replay it to verify idempotence.
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/20261101_lcmsms_validation_phase1i.sql
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/20261101_lcmsms_validation_phase1i.sql

          test "$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT to_regclass('public.lcms_batch_validation_reports') IS NOT NULL")" = "t"
          test "$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT COUNT(*) = 1 FROM pg_indexes WHERE indexname = 'uq_lcms_batch_validation_report_hash'")" = "t"
          test "$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT COUNT(*) = 1 FROM information_schema.columns WHERE table_name = 'lcms_ms2_spectra' AND column_name = 'spectrum_type'")" = "t"
          test "$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT association_status || ':' || spectrum_type || ':' || (feature_id IS NOT NULL)::text FROM lcms_ms2_spectra WHERE scan_identifier = 'legacy-ms2-scan'")" = "matched:unknown:true"
          echo "Phase 1G -> 1H -> 1I upgrade, legacy MS2 preservation and migration replay passed."
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lcmsms.txt

      - name: Install isolated LC-MS/MS requirements
        run: python -m pip install --upgrade pip && pip install -r backend/requirements-lcmsms.txt

      - name: Run LC-MS/MS algorithm tests
        run: pytest -q backend/tests/test_lcmsms_engine.py
