name: N3XORA-Sahel BioEvidence tests

on:
  push:
    branches:
      - main
      - feature/n3xora-sahel-bioevidence
      - feature/research-fsm-transactional-outbox
      - feature/experimental-evidence-validation
      - feature/experimental-analytics-engine-v1
      - integration/assay-statistics-4pl-validation-v1
      - security/hardening-deps-scientific-governance
      - feature/lcmsms-engine-phase1h
      - feature/lcmsms-validation-phase1i
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-research-gates:
    runs-on: ubuntu-latest
    env:
      APP_NAME: N3XORA CI
      APP_VERSION: 2.0.0
      DEBUG: "true"
      DATABASE_URL: sqlite:///./ci_nexora.db
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      SECRET_KEY: ci-only-secret-key-with-more-than-32-characters-2026
      ADMIN_EMAIL: ci-admin@nexora.test
      AFRICAN_LIBS_DIR: /tmp/n3xora-african-libs
      OFFLINE_PACKAGES_DIR: /tmp/n3xora-offline-packages
      STORAGE_DIR: /tmp/n3xora-storage
      UPLOAD_DIR: /tmp/n3xora-storage/uploads
      RESULTS_DIR: /tmp/n3xora-storage/results
      TEMP_DIR: /tmp/n3xora-storage/temp
      AMRFINDER_REQUIRED: "false"
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: gemma2:2b

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend requirements
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Compile Python source
        run: python -m compileall -q backend/app backend/tests

      - name: Run BioEvidence regression tests
        run: >-
          pytest -q
          backend/tests/test_phytochemistry.py
          backend/tests/test_lcmsms_api.py
          backend/tests/test_lcmsms_validation.py
          backend/tests/test_research_bioevidence.py
          backend/tests/test_amrfinder_readiness.py
          backend/tests/test_config_security.py
          backend/tests/test_heuristic_scientific_guards.py
          backend/tests/test_virtual_screening_phase7.py
          backend/tests/test_amrfinder_integration.py
          backend/tests/test_rna_structure_integration.py
          backend/tests/test_research_workflow_fsm.py
          backend/tests/test_research_workflow_fsm_api.py
          backend/tests/test_experimental_evidence.py
          backend/tests/test_experimental_analytics.py
          backend/tests/test_experimental_analytics_api.py
          backend/tests/test_assay_statistics.py
          backend/tests/test_assay_docking_comparison.py
          backend/tests/test_task_outbox.py
          backend/tests/test_scientific_workflow_core.py
          backend/tests/test_scientific_workflow_execution.py
          backend/tests/test_scientific_workflow_phase1d.py
          backend/tests/test_scientific_workflow_phase1e.py
          backend/tests/test_scientific_provenance.py
          backend/tests/test_structure_validation_phase3.py

      - name: Check shared and analytics JavaScript syntax
        run: |
          node --check frontend/js/api.js
          node --check frontend/js/research-analytics.js

      - name: Extract and check inline page scripts
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for source in ("frontend/research.html", "frontend/phytochemistry.html"):
              html = Path(source).read_text(encoding="utf-8")
              scripts = re.findall(r"<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>", html, re.I | re.S)
              if not scripts:
                  raise SystemExit(f"No inline script found in {source}")
              target = Path("/tmp") / (Path(source).stem + "-inline.js")
              target.write_text("\n".join(scripts), encoding="utf-8")
              print(f"Prepared {target}")
          PY
          node --check /tmp/research-inline.js
          node --check /tmp/phytochemistry-inline.js

      - name: Build backend Docker image including AMRFinderPlus
        run: docker build --build-arg INSTALL_AMRFINDERPLUS=true --build-arg AMRFINDERPLUS_VERSION=4.2.7 -t nexora-v2-ci:latest backend

      - name: Build isolated LC-MS/MS worker image
        run: docker build -f backend/Dockerfile.lcmsms --build-arg INSTALL_AMRFINDERPLUS=false -t nexora-v2-lcmsms-ci:latest backend

      - name: Validate Docker Compose configuration
        run: |
          cat > .env <<'EOF'
          DB_USER=nexora_ci
          DB_PASSWORD=ci-only-password-strong-enough
          DB_NAME=nexora_ci
          FLOWER_BASIC_AUTH=ci:ci-only-password
          DATABASE_URL=postgresql://nexora_ci:ci-only-password-strong-enough@db:5432/nexora_ci
          REDIS_URL=redis://redis:6379/0
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/1
          SECRET_KEY=ci-only-secret-key-with-more-than-32-characters-2026
          ADMIN_EMAIL=ci-admin@nexora.test
          EOF
          docker compose config --quiet

      - name: Validate Phase 1H to 1I PostgreSQL migrations
        run: |
          set -euo pipefail
          container=nexora-phase1i-postgres
          docker run --detach --name "$container" \
            -e POSTGRES_PASSWORD=ci-only-password \
            -e POSTGRES_DB=nexora_ci \
            postgres:16-alpine
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if docker exec "$container" pg_isready -U postgres -d nexora_ci; then
              break
            fi
            sleep 2
          done
          docker exec "$container" pg_isready -U postgres -d nexora_ci

          git fetch origin main --depth=1
          git show FETCH_HEAD:infra/postgres/init.sql > /tmp/nexora-phase1g-init.sql

          # Start from the Phase 1G schema currently deployed on main.
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < /tmp/nexora-phase1g-init.sql

          # Upgrade through the Phase 1H and Phase 1I additive migrations.
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/20261101_lcmsms_phase1h_schema.sql
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/20261102_lcmsms_validation_phase1i.sql

          # Migration must be safe to re-run.
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/20261102_lcmsms_validation_phase1i.sql

          test "$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT to_regclass('public.lcms_batch_validation_reports') IS NOT NULL")" = "t"
          test "$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT COUNT(*) = 1 FROM pg_indexes WHERE indexname = 'uq_lcms_batch_validation_report_hash'")" = "t"
          test "$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT COUNT(*) = 1 FROM information_schema.columns WHERE table_name = 'lcms_ms2_spectra' AND column_name = 'spectrum_type'")" = "t"
          echo "Phase 1G -> 1H -> 1I migration and idempotent replay passed."

  lcmsms-engine-tests:
    runs-on: ubuntu-latest
    env:
      APP_NAME: N3XORA LCMS CI
      APP_VERSION: 2.0.0
      DEBUG: "true"
      DATABASE_URL: sqlite:///./ci_lcmsms.db
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      SECRET_KEY: ci-only-secret-key-with-more-than-32-characters-2026
      ADMIN_EMAIL: ci-admin@nexora.test
      AFRICAN_LIBS_DIR: /tmp/n3xora-african-libs
      OFFLINE_PACKAGES_DIR: /tmp/n3xora-offline-packages
      STORAGE_DIR: /tmp/n3xora-storage
      UPLOAD_DIR: /tmp/n3xora-storage/uploads
      RESULTS_DIR: /tmp/n3xora-storage/results
      TEMP_DIR: /tmp/n3xora-storage/temp
      LCMS_STORAGE_DIR: /tmp/n3xora-lcms-storage
      AMRFINDER_REQUIRED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lcmsms.txt

      - name: Install isolated LC-MS/MS requirements
        run: python -m pip install --upgrade pip && pip install -r backend/requirements-lcmsms.txt

      - name: Run LC-MS/MS algorithm tests
        run: pytest -q backend/tests/test_lcmsms_engine.py
