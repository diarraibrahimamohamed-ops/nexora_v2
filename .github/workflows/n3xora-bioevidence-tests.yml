name: N3XORA-Sahel BioEvidence tests

on:
  push:
    branches:
      - main
      - feature/n3xora-sahel-bioevidence
      - feature/research-fsm-transactional-outbox
      - feature/experimental-evidence-validation
      - feature/experimental-analytics-engine-v1
      - integration/assay-statistics-4pl-validation-v1
      - security/hardening-deps-scientific-governance
      - feature/lcmsms-engine-phase1h
      - feature/lcmsms-validation-phase1i
      - integration/lcmsms-phase1j-reconciled
      - fix/structure-provider-fallback-mmCIF-2026-11
      - fix/docking-sequence-validation-vina-settings-2026-11
      - fix/ncbi-provider-reliability-2026-11
      - feature/rcsb-alphafold-csm-provider-2026-11
      - fix/rcsb-experimental-candidate-ranking-2026-11
      - fix/docking-pocket-provenance-2026-11
      - fix/docking-pdbqt-manifest-validation-2026-11
      - fix/asp-numeric-validation-2026-11
      - feature/phytoevidence-wcvp-taxonomy-resolution
      - feature/phytoevidence-occurrence-evidence-phase1lC
      - feature/phytoevidence-integrated-research-view-phase1lD
      - feature/phytoevidence-bioactivity-assay-linkage-phase1lE
  pull_request:
    branches:
      - main
      - fix/auth-proxy-baseline-2026-11
      - fix/structure-provider-fallback-mmCIF-2026-11
      - fix/docking-sequence-validation-vina-settings-2026-11
      - fix/ncbi-provider-reliability-2026-11
      - feature/rcsb-alphafold-csm-provider-2026-11
      - fix/docking-pocket-provenance-2026-11
      - fix/docking-pdbqt-manifest-validation-2026-11
      - fix/asp-numeric-validation-2026-11
      - feature/phytoevidence-occurrence-evidence-phase1lC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-research-gates:
    runs-on: ubuntu-latest
    env:
      APP_NAME: N3XORA CI
      APP_VERSION: 2.0.0
      DEBUG: "true"
      DATABASE_URL: sqlite:///./ci_nexora.db
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      SECRET_KEY: ci-only-secret-key-with-more-than-32-characters-2026
      ADMIN_EMAIL: ci-admin@nexora.test
      AFRICAN_LIBS_DIR: /tmp/n3xora-african-libs
      OFFLINE_PACKAGES_DIR: /tmp/n3xora-offline-packages
      STORAGE_DIR: /tmp/n3xora-storage
      UPLOAD_DIR: /tmp/n3xora-storage/uploads
      RESULTS_DIR: /tmp/n3xora-storage/results
      TEMP_DIR: /tmp/n3xora-storage/temp
      AMRFINDER_REQUIRED: "false"
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: gemma2:2b

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend requirements
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Compile Python source
        run: python -m compileall -q backend/app backend/tests scripts

      - name: Run BioEvidence regression tests
        run: >-
          pytest -q
          backend/tests/test_api.py
          backend/tests/test_protein_structure_provider_resilience.py
          backend/tests/test_docking_integrity.py
          backend/tests/test_pocket_detection_provenance.py
          backend/tests/test_asp_scoring.py
          backend/tests/test_ncbi_client.py
          backend/tests/test_ncbi_routes.py
          backend/tests/test_phytochemistry.py
          backend/tests/test_phytochemical_sources.py
          backend/tests/test_taxonomic_resolution.py
          backend/tests/test_phytochemical_occurrence_evidence.py
          backend/tests/test_phytochemical_evidence_integration.py
          backend/tests/test_lcmsms_api.py
          backend/tests/test_lcmsms_validation.py
          backend/tests/test_lcmsms_alignment.py
          backend/tests/test_lcmsms_quantification.py
          backend/tests/test_lcmsms_dataset_inventory.py
          backend/tests/test_research_bioevidence.py
          backend/tests/test_amrfinder_readiness.py
          backend/tests/test_config_security.py
          backend/tests/test_heuristic_scientific_guards.py
          backend/tests/test_virtual_screening_phase7.py
          backend/tests/test_amrfinder_integration.py
          backend/tests/test_rna_structure_integration.py
          backend/tests/test_research_workflow_fsm.py
          backend/tests/test_research_workflow_fsm_api.py
          backend/tests/test_experimental_evidence.py
          backend/tests/test_experimental_analytics.py
          backend/tests/test_experimental_analytics_api.py
          backend/tests/test_assay_statistics.py
          backend/tests/test_assay_docking_comparison.py
          backend/tests/test_task_outbox.py
          backend/tests/test_scientific_workflow_core.py
          backend/tests/test_scientific_workflow_execution.py
          backend/tests/test_scientific_workflow_phase1d.py
          backend/tests/test_scientific_workflow_phase1e.py
          backend/tests/test_scientific_provenance.py
          backend/tests/test_sequence_engine_regressions.py
          backend/tests/test_structure_validation_phase3.py

      - name: Check shared and analytics JavaScript syntax
        run: |
          node --check frontend/js/api.js
          node --check frontend/js/research-analytics.js

      - name: Extract and check inline page scripts
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for source in ("frontend/research.html", "frontend/phytochemistry.html"):
              html = Path(source).read_text(encoding="utf-8")
              scripts = re.findall(r"<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>", html, re.I | re.S)
              if not scripts:
                  raise SystemExit(f"No inline script found in {source}")
              target = Path("/tmp") / (Path(source).stem + "-inline.js")
              target.write_text("\n".join(scripts), encoding="utf-8")
              print(f"Prepared {target}")
          PY
          node --check /tmp/research-inline.js
          node --check /tmp/phytochemistry-inline.js

      - name: Validate production Nginx configuration
        run: |
          docker run --rm \
            -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: Smoke-test Nginx auth proxy path and bearer header
        run: |
          set -euo pipefail
          network=n3xora-auth-proxy-ci
          docker network create "$network"
          trap 'docker rm -f n3xora-auth-mock n3xora-nginx-proxy >/dev/null 2>&1 || true; docker network rm "$network" >/dev/null 2>&1 || true' EXIT

          cat > /tmp/n3xora-mock-api.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import json

          class Handler(BaseHTTPRequestHandler):
              def respond(self):
                  size = int(self.headers.get("Content-Length", "0"))
                  body = self.rfile.read(size).decode("utf-8") if size else ""
                  payload = {
                      "method": self.command,
                      "path": self.path,
                      "authorization": self.headers.get("Authorization"),
                      "x_real_ip": self.headers.get("X-Real-IP"),
                      "body": body,
                  }
                  encoded = json.dumps(payload).encode("utf-8")
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(encoded)))
                  self.end_headers()
                  self.wfile.write(encoded)

              do_GET = respond
              do_POST = respond

          HTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
          PY

          docker run --detach --name n3xora-auth-mock \
            --network "$network" --network-alias api \
            -v /tmp/n3xora-mock-api.py:/mock_api.py:ro \
            python:3.12-alpine python /mock_api.py

          docker run --detach --name n3xora-nginx-proxy \
            --network "$network" -p 18080:80 \
            -v "$PWD/infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine

          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:18080/health >/tmp/n3xora-health.json; then
              break
            fi
            sleep 1
          done
          test "$(python -c 'import json; print(json.load(open("/tmp/n3xora-health.json"))["path"])')" = "/health"

          login_response="$(curl --silent --show-error --fail -X POST \
            -H 'Content-Type: application/json' \
            -H 'X-Real-IP: 192.0.2.77' \
            --data '{"email":"ci@nexora.test","password":"ci-password"}' \
            http://127.0.0.1:18080/api/v1/auth/login)"
          python - "$login_response" <<'PY'
          import json
          import sys
          payload = json.loads(sys.argv[1])
          assert payload["path"] == "/api/v1/auth/login", payload
          assert payload["method"] == "POST", payload
          assert payload["body"] == '{"email":"ci@nexora.test","password":"ci-password"}', payload
          assert payload["x_real_ip"] != "192.0.2.77", payload
          PY

          me_response="$(curl --silent --show-error --fail \
            -H 'Authorization: Bearer n3xora-ci-token' \
            http://127.0.0.1:18080/api/v1/auth/me)"
          python - "$me_response" <<'PY'
          import json
          import sys
          payload = json.loads(sys.argv[1])
          assert payload["path"] == "/api/v1/auth/me", payload
          assert payload["authorization"] == "Bearer n3xora-ci-token", payload
          PY
      - name: Build backend Docker image including AMRFinderPlus
        run: docker build --build-arg INSTALL_AMRFINDERPLUS=true --build-arg AMRFINDERPLUS_VERSION=4.2.7 -t nexora-v2-ci:latest backend

      - name: Build isolated LC-MS/MS worker image
        run: docker build -f backend/Dockerfile.lcmsms --build-arg INSTALL_AMRFINDERPLUS=false -t nexora-v2-lcmsms-ci:latest backend

      - name: Validate Docker Compose configuration
        run: |
          cat > .env <<'EOF'
          DB_USER=nexora_ci
          DB_PASSWORD=ci-only-password-strong-enough
          DB_NAME=nexora_ci
          FLOWER_BASIC_AUTH=ci:ci-only-password
          DATABASE_URL=postgresql://nexora_ci:ci-only-password-strong-enough@db:5432/nexora_ci
          REDIS_URL=redis://redis:6379/0
          CELERY_BROKER_URL=redis://redis:6379/0
          CELERY_RESULT_BACKEND=redis://redis:6379/1
          SECRET_KEY=ci-only-secret-key-with-more-than-32-characters-2026
          ADMIN_EMAIL=ci-admin@nexora.test
          EOF
          docker compose config --quiet

      - name: Validate Phase 1H MS2 feature-deletion integrity migration
        run: |
          set -euo pipefail
          container=nexora-phase1h-ms2-integrity
          docker run --detach --name "$container" \
            -e POSTGRES_PASSWORD=ci-only-password \
            -e POSTGRES_DB=nexora_ci \
            postgres:16-alpine
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if docker exec "$container" pg_isready -U postgres -d nexora_ci; then break; fi
            sleep 2
          done
          docker exec "$container" pg_isready -U postgres -d nexora_ci

          cat > /tmp/phase1h-ms2-fixture.sql <<'SQL'
          CREATE TABLE scientific_workflow_runs (id SERIAL PRIMARY KEY);
          CREATE TABLE lcms_spectral_libraries (id SERIAL PRIMARY KEY);
          CREATE TABLE lcms_processing_runs (
              id SERIAL PRIMARY KEY
          );
          CREATE TABLE lcms_features (id SERIAL PRIMARY KEY);
          CREATE TABLE lcms_ms2_spectra (
              id SERIAL PRIMARY KEY,
              feature_id INT NOT NULL
                  REFERENCES lcms_features(id) ON DELETE CASCADE
          );
          INSERT INTO lcms_features DEFAULT VALUES;
          INSERT INTO lcms_ms2_spectra(feature_id) VALUES (1);
          SQL
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < /tmp/phase1h-ms2-fixture.sql

          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/20261101_lcmsms_phase1h_schema.sql
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/20261101_lcmsms_ms2_feature_delete_integrity.sql
          # Both migrations must be safely replayable.
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/20261101_lcmsms_phase1h_schema.sql
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/20261101_lcmsms_ms2_feature_delete_integrity.sql

          test "$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT COUNT(*) FROM pg_constraint WHERE conrelid = 'public.lcms_ms2_spectra'::regclass AND contype = 'f' AND pg_get_constraintdef(oid) ILIKE 'FOREIGN KEY (feature_id) REFERENCES lcms_features(id) ON DELETE SET NULL%'")" = "1"
          docker exec "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci -c "DELETE FROM lcms_features WHERE id = 1"
          test "$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT association_status || ':' || COALESCE(feature_id::text, 'null') || ':' || (association_candidates @> jsonb_build_array(jsonb_build_object('former_feature_id',1,'reason','source_feature_deleted')))::text FROM lcms_ms2_spectra WHERE id = 1")" = "unmatched:null:true"
          echo "Phase 1H preserves MS2 evidence and former feature identity on feature deletion."


      - name: Validate Phase 1H to 1I PostgreSQL migrations
        run: |
          set -euo pipefail
          container=nexora-phase1i-postgres
          docker run --detach --name "$container" \
            -e POSTGRES_PASSWORD=ci-only-password \
            -e POSTGRES_DB=nexora_ci \
            postgres:16-alpine
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if docker exec "$container" pg_isready -U postgres -d nexora_ci; then
              break
            fi
            sleep 2
          done
          docker exec "$container" pg_isready -U postgres -d nexora_ci

          # Minimal Phase 1G fixture copied from the deployed LC-MS/MS DDL.
          # Avoid unrelated legacy init.sql dependencies outside this migration test.
          cat > /tmp/phase1g-lcmsms.sql <<'SQL'
          CREATE TABLE users (id SERIAL PRIMARY KEY);
          CREATE TABLE research_studies (
              id SERIAL PRIMARY KEY,
              user_id INT NOT NULL REFERENCES users(id)
          );
          CREATE TABLE scientific_workflow_runs (id SERIAL PRIMARY KEY);
          CREATE TABLE lcms_analytical_batches (
              id SERIAL PRIMARY KEY,
              study_id INT NOT NULL REFERENCES research_studies(id)
          );
          CREATE TABLE lcms_injections (
              id SERIAL PRIMARY KEY,
              study_id INT NOT NULL REFERENCES research_studies(id),
              batch_id INT NOT NULL REFERENCES lcms_analytical_batches(id),
              injection_order INT NOT NULL
          );
          CREATE TABLE lcms_data_artifacts (
              id SERIAL PRIMARY KEY,
              injection_id INT NOT NULL REFERENCES lcms_injections(id)
          );
          CREATE TABLE lcms_spectral_libraries (
              id SERIAL PRIMARY KEY,
              name VARCHAR(160) NOT NULL,
              version VARCHAR(120) NOT NULL,
              source_license VARCHAR(255) NOT NULL
          );
          CREATE TABLE lcms_processing_runs (
              id SERIAL PRIMARY KEY,
              study_id INT NOT NULL REFERENCES research_studies(id),
              batch_id INT NOT NULL REFERENCES lcms_analytical_batches(id),
              spectral_library_id INT REFERENCES lcms_spectral_libraries(id) ON DELETE SET NULL,
              software_name VARCHAR(160) NOT NULL,
              software_version VARCHAR(120) NOT NULL,
              workflow_name VARCHAR(160) NOT NULL,
              workflow_version VARCHAR(120),
              parameters JSONB NOT NULL DEFAULT '{}'::jsonb,
              input_sha256 VARCHAR(64) NOT NULL,
              output_sha256 VARCHAR(64),
              status VARCHAR(30) NOT NULL DEFAULT 'registered',
              started_at TIMESTAMP,
              completed_at TIMESTAMP,
              created_by INT REFERENCES users(id) ON DELETE SET NULL,
              provenance_manifest JSONB NOT NULL DEFAULT '{}'::jsonb,
              created_at TIMESTAMP NOT NULL DEFAULT NOW(),
              CONSTRAINT ck_lcms_processing_status CHECK(
                  status IN ('registered','processing','completed','failed')
              )
          );
          CREATE TABLE lcms_features (
              id SERIAL PRIMARY KEY,
              processing_run_id INT NOT NULL REFERENCES lcms_processing_runs(id) ON DELETE CASCADE,
              feature_key VARCHAR(120) NOT NULL,
              precursor_mz NUMERIC(18,8) NOT NULL,
              retention_time NUMERIC(18,8) NOT NULL,
              retention_time_unit VARCHAR(30) NOT NULL DEFAULT 'second',
              polarity VARCHAR(20) NOT NULL,
              charge INT,
              adduct VARCHAR(80),
              molecular_formula_candidate VARCHAR(160),
              isotope_group VARCHAR(120),
              quality_flags JSONB NOT NULL DEFAULT '[]'::jsonb,
              created_at TIMESTAMP NOT NULL DEFAULT NOW(),
              CONSTRAINT uq_lcms_feature_processing_key UNIQUE(processing_run_id, feature_key)
          );
          CREATE TABLE lcms_ms2_spectra (
              id SERIAL PRIMARY KEY,
              feature_id INT NOT NULL REFERENCES lcms_features(id) ON DELETE CASCADE,
              injection_id INT NOT NULL REFERENCES lcms_injections(id) ON DELETE CASCADE,
              artifact_id INT REFERENCES lcms_data_artifacts(id) ON DELETE SET NULL,
              scan_identifier VARCHAR(120),
              precursor_mz NUMERIC(18,8) NOT NULL,
              isolation_window NUMERIC(12,6),
              collision_energy NUMERIC(12,6),
              collision_energy_unit VARCHAR(40),
              polarity VARCHAR(20) NOT NULL,
              charge INT,
              fragments JSONB NOT NULL DEFAULT '[]'::jsonb,
              acquired_at TIMESTAMP,
              created_at TIMESTAMP NOT NULL DEFAULT NOW()
          );

          INSERT INTO users DEFAULT VALUES;
          INSERT INTO research_studies(user_id) VALUES (1);
          INSERT INTO lcms_analytical_batches(study_id) VALUES (1);
          INSERT INTO lcms_injections(study_id, batch_id, injection_order) VALUES (1, 1, 1);
          INSERT INTO lcms_processing_runs(
              study_id, batch_id, software_name, software_version,
              workflow_name, workflow_version, parameters, input_sha256,
              output_sha256, status, created_by
          ) VALUES (
              1, 1, 'OpenMS', '3.6.0', 'phase1g-fixture', '1.0.0', '{}'::jsonb,
              repeat('a', 64), repeat('b', 64), 'completed', 1
          );
          INSERT INTO lcms_features(
              processing_run_id, feature_key, precursor_mz, retention_time, polarity
          ) VALUES (1, 'FT-LEGACY-001', 301.1234, 10.0, 'positive');
          INSERT INTO lcms_ms2_spectra(
              feature_id, injection_id, scan_identifier, precursor_mz, polarity
          ) VALUES (1, 1, 'legacy-ms2-scan', 301.1234, 'positive');
          SQL

          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < /tmp/phase1g-lcmsms.sql

          # Upgrade the existing Phase 1G data model to the current Phase 1H shape.
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/20261101_lcmsms_phase1h_schema.sql
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/20261101_lcmsms_ms2_feature_delete_integrity.sql

          # Apply the Phase 1I report migration, then replay it to verify idempotence.
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/20261101_lcmsms_validation_phase1i.sql
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/20261101_lcmsms_validation_phase1i.sql

          test "$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT to_regclass('public.lcms_batch_validation_reports') IS NOT NULL")" = "t"
          test "$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT COUNT(*) = 1 FROM pg_indexes WHERE indexname = 'uq_lcms_batch_validation_report_hash'")" = "t"
          test "$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT COUNT(*) = 1 FROM information_schema.columns WHERE table_name = 'lcms_ms2_spectra' AND column_name = 'spectrum_type'")" = "t"
          test "$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT association_status || ':' || spectrum_type || ':' || (feature_id IS NOT NULL)::text FROM lcms_ms2_spectra WHERE scan_identifier = 'legacy-ms2-scan'")" = "matched:unknown:true"
          echo "Phase 1G -> 1H -> 1I upgrade, legacy MS2 preservation and migration replay passed."

      - name: Validate Phase 1G to 1J migrations with MS2 preservation
        run: |
          set -euo pipefail
          container=nexora-phase1j-postgres
          docker run --detach --name "$container" \
            -e POSTGRES_PASSWORD=ci-only-password \
            -e POSTGRES_DB=nexora_ci \
            postgres:16-alpine
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if docker exec "$container" pg_isready -U postgres -d nexora_ci; then
              break
            fi
            sleep 2
          done
          docker exec "$container" pg_isready -U postgres -d nexora_ci

          # Minimal Phase 1G fixture copied from the deployed LC-MS/MS DDL.
          # Avoid unrelated legacy init.sql dependencies outside this migration test.
          cat > /tmp/phase1g-lcmsms.sql <<'SQL'
          CREATE TABLE users (id SERIAL PRIMARY KEY);
          CREATE TABLE research_studies (
              id SERIAL PRIMARY KEY,
              user_id INT NOT NULL REFERENCES users(id)
          );
          CREATE TABLE scientific_workflow_runs (id SERIAL PRIMARY KEY);
          CREATE TABLE lcms_analytical_batches (
              id SERIAL PRIMARY KEY,
              study_id INT NOT NULL REFERENCES research_studies(id)
          );
          CREATE TABLE lcms_injections (
              id SERIAL PRIMARY KEY,
              study_id INT NOT NULL REFERENCES research_studies(id),
              batch_id INT NOT NULL REFERENCES lcms_analytical_batches(id),
              injection_order INT NOT NULL
          );
          CREATE TABLE lcms_data_artifacts (
              id SERIAL PRIMARY KEY,
              injection_id INT NOT NULL REFERENCES lcms_injections(id)
          );
          CREATE TABLE lcms_spectral_libraries (
              id SERIAL PRIMARY KEY,
              name VARCHAR(160) NOT NULL,
              version VARCHAR(120) NOT NULL,
              source_license VARCHAR(255) NOT NULL
          );
          CREATE TABLE lcms_processing_runs (
              id SERIAL PRIMARY KEY,
              study_id INT NOT NULL REFERENCES research_studies(id),
              batch_id INT NOT NULL REFERENCES lcms_analytical_batches(id),
              spectral_library_id INT REFERENCES lcms_spectral_libraries(id) ON DELETE SET NULL,
              software_name VARCHAR(160) NOT NULL,
              software_version VARCHAR(120) NOT NULL,
              workflow_name VARCHAR(160) NOT NULL,
              workflow_version VARCHAR(120),
              parameters JSONB NOT NULL DEFAULT '{}'::jsonb,
              input_sha256 VARCHAR(64) NOT NULL,
              output_sha256 VARCHAR(64),
              status VARCHAR(30) NOT NULL DEFAULT 'registered',
              started_at TIMESTAMP,
              completed_at TIMESTAMP,
              created_by INT REFERENCES users(id) ON DELETE SET NULL,
              provenance_manifest JSONB NOT NULL DEFAULT '{}'::jsonb,
              created_at TIMESTAMP NOT NULL DEFAULT NOW(),
              CONSTRAINT ck_lcms_processing_status CHECK(
                  status IN ('registered','processing','completed','failed')
              )
          );
          CREATE TABLE lcms_features (
              id SERIAL PRIMARY KEY,
              processing_run_id INT NOT NULL REFERENCES lcms_processing_runs(id) ON DELETE CASCADE,
              feature_key VARCHAR(120) NOT NULL,
              precursor_mz NUMERIC(18,8) NOT NULL,
              retention_time NUMERIC(18,8) NOT NULL,
              retention_time_unit VARCHAR(30) NOT NULL DEFAULT 'second',
              polarity VARCHAR(20) NOT NULL,
              charge INT,
              adduct VARCHAR(80),
              molecular_formula_candidate VARCHAR(160),
              isotope_group VARCHAR(120),
              quality_flags JSONB NOT NULL DEFAULT '[]'::jsonb,
              created_at TIMESTAMP NOT NULL DEFAULT NOW(),
              CONSTRAINT uq_lcms_feature_processing_key UNIQUE(processing_run_id, feature_key)
          );
          CREATE TABLE lcms_feature_observations (
              id SERIAL PRIMARY KEY,
              feature_id INT NOT NULL REFERENCES lcms_features(id) ON DELETE CASCADE,
              injection_id INT NOT NULL REFERENCES lcms_injections(id) ON DELETE CASCADE,
              observed_mz NUMERIC(18,8),
              retention_time NUMERIC(18,8),
              peak_area NUMERIC(24,8),
              peak_height NUMERIC(24,8),
              intensity NUMERIC(24,8),
              signal_to_noise NUMERIC(18,8),
              quality_flag VARCHAR(40) NOT NULL DEFAULT 'not_assessed',
              metadata JSONB NOT NULL DEFAULT '{}'::jsonb,
              created_at TIMESTAMP NOT NULL DEFAULT NOW(),
              CONSTRAINT uq_lcms_feature_observation_feature_injection UNIQUE(feature_id, injection_id)
          );
          CREATE TABLE lcms_ms2_spectra (
              id SERIAL PRIMARY KEY,
              feature_id INT NOT NULL REFERENCES lcms_features(id) ON DELETE CASCADE,
              injection_id INT NOT NULL REFERENCES lcms_injections(id) ON DELETE CASCADE,
              artifact_id INT REFERENCES lcms_data_artifacts(id) ON DELETE SET NULL,
              scan_identifier VARCHAR(120),
              precursor_mz NUMERIC(18,8) NOT NULL,
              isolation_window NUMERIC(12,6),
              collision_energy NUMERIC(12,6),
              collision_energy_unit VARCHAR(40),
              polarity VARCHAR(20) NOT NULL,
              charge INT,
              fragments JSONB NOT NULL DEFAULT '[]'::jsonb,
              acquired_at TIMESTAMP,
              created_at TIMESTAMP NOT NULL DEFAULT NOW()
          );

          INSERT INTO users DEFAULT VALUES;
          INSERT INTO research_studies(user_id) VALUES (1);
          INSERT INTO lcms_analytical_batches(study_id) VALUES (1);
          INSERT INTO lcms_injections(study_id, batch_id, injection_order) VALUES (1, 1, 1);
          INSERT INTO lcms_processing_runs(
              study_id, batch_id, software_name, software_version,
              workflow_name, workflow_version, parameters, input_sha256,
              output_sha256, status, created_by
          ) VALUES (
              1, 1, 'OpenMS', '3.6.0', 'phase1g-fixture', '1.0.0', '{}'::jsonb,
              repeat('a', 64), repeat('b', 64), 'completed', 1
          );
          INSERT INTO lcms_features(
              processing_run_id, feature_key, precursor_mz, retention_time, polarity
          ) VALUES (1, 'FT-LEGACY-001', 301.1234, 10.0, 'positive');
          INSERT INTO lcms_ms2_spectra(
              feature_id, injection_id, scan_identifier, precursor_mz, polarity
          ) VALUES (1, 1, 'legacy-ms2-scan', 301.1234, 'positive');
          SQL

          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < /tmp/phase1g-lcmsms.sql

          # Upgrade the existing Phase 1G data model to the current Phase 1H shape.
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/20261101_lcmsms_phase1h_schema.sql

          # Preserve legacy MS2 evidence when its source feature is deleted.
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/20261101_lcmsms_ms2_feature_delete_integrity.sql

          # Apply the Phase 1I report migration, then replay it to verify idempotence.
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/20261101_lcmsms_validation_phase1i.sql
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/20261101_lcmsms_validation_phase1i.sql

          # Add the Phase 1J alignment/quantification tables and replay idempotently.
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/20261101_lcmsms_alignment_phase1j.sql
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/20261101_lcmsms_alignment_phase1j.sql

          test "$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT to_regclass('public.lcms_batch_validation_reports') IS NOT NULL")" = "t"
          test "$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT to_regclass('public.lcms_feature_alignment_runs') IS NOT NULL AND to_regclass('public.lcms_aligned_features') IS NOT NULL AND to_regclass('public.lcms_aligned_feature_members') IS NOT NULL")" = "t"
          test "$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT to_regclass('public.lcms_quantification_runs') IS NOT NULL AND to_regclass('public.lcms_normalized_feature_quantifications') IS NOT NULL")" = "t"
          test "$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT COUNT(*) = 1 FROM pg_indexes WHERE indexname = 'uq_lcms_batch_validation_report_hash'")" = "t"
          test "$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT COUNT(*) = 1 FROM information_schema.columns WHERE table_name = 'lcms_ms2_spectra' AND column_name = 'spectrum_type'")" = "t"
          test "$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT association_status || ':' || spectrum_type || ':' || (feature_id IS NOT NULL)::text FROM lcms_ms2_spectra WHERE scan_identifier = 'legacy-ms2-scan'")" = "matched:unknown:true"
          docker exec "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci -c "DELETE FROM lcms_features WHERE id = 1"
          test "$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT association_status || ':' || (feature_id IS NULL)::text || ':' || (jsonb_array_length(association_candidates) > 0)::text FROM lcms_ms2_spectra WHERE scan_identifier = 'legacy-ms2-scan'")" = "unmatched:true:true"
          echo "Phase 1G -> 1H -> 1I -> 1J upgrade, legacy MS2 preservation and idempotent migration replay passed."
      - name: Validate PhytoEvidence migrations 014 to 015
        run: |
          set -euo pipefail
          container=nexora-phytoevidence-1lc-postgres
          docker run --detach --name "$container" \
            -e POSTGRES_PASSWORD=ci-only-password \
            -e POSTGRES_DB=nexora_ci \
            postgres:16-alpine
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if docker exec "$container" pg_isready -U postgres -d nexora_ci; then break; fi
            sleep 2
          done
          docker exec "$container" pg_isready -U postgres -d nexora_ci

          # Minimal Phase 1G/1L prerequisite schema. The test focuses on the
          # additive 014/015 migrations and their real PostgreSQL constraints.
          cat > /tmp/phytoevidence-prerequisites.sql <<'SQL'
          CREATE TABLE users (id SERIAL PRIMARY KEY);
          CREATE TABLE phytochem_candidates (id SERIAL PRIMARY KEY);
          CREATE TABLE botanical_specimens (id SERIAL PRIMARY KEY);
          CREATE TABLE plant_material_samples (id SERIAL PRIMARY KEY);
          CREATE TABLE plant_extraction_batches (id SERIAL PRIMARY KEY);
          CREATE TABLE plant_fractions (id SERIAL PRIMARY KEY);
          CREATE TABLE lcms_compound_annotations (id SERIAL PRIMARY KEY);
          SQL
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < /tmp/phytoevidence-prerequisites.sql

          # Apply WCVP resolution followed by occurrence evidence; replay both.
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/014_phytochem_wcvp_taxon_resolutions.sql
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/015_phytochem_occurrence_evidence.sql
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/014_phytochem_wcvp_taxon_resolutions.sql
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/015_phytochem_occurrence_evidence.sql
          # Add durable curator identities and replay the audit migration.
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/016_phytochem_taxon_resolution_curation_audit.sql
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/016_phytochem_taxon_resolution_curation_audit.sql

          tables_check="$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT to_regclass('public.phytochem_taxon_resolutions') IS NOT NULL AND to_regclass('public.phytochem_occurrence_evidence') IS NOT NULL")"
          index_check="$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT COUNT(*) > 0 FROM pg_indexes WHERE indexname = 'ix_phytochem_occurrence_candidate_review'")"
          constraint_check="$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT COUNT(*) > 0 FROM pg_constraint WHERE conname = 'ck_phytochem_occurrence_lcms_lineage'")"
          echo "PhytoEvidence schema checks: tables=$tables_check index=$index_check lcms_constraint=$constraint_check"
          test "$tables_check" = "t"
          test "$index_check" = "t"
          test "$constraint_check" = "t"

          audit_schema_check="$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT COUNT(*) = 3 FROM information_schema.columns WHERE table_name = 'phytochem_taxon_resolutions' AND column_name IN ('created_by','created_by_label','reviewed_by_user_id')")"
          audit_fk_check="$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT COUNT(*) = 2 FROM pg_constraint WHERE conrelid = 'phytochem_taxon_resolutions'::regclass AND contype = 'f' AND conname IN ('fk_phytochem_taxon_resolution_created_by','fk_phytochem_taxon_resolution_reviewed_by_user')")"
          audit_constraint_check="$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT COUNT(*) = 1 FROM pg_constraint WHERE conrelid = 'phytochem_taxon_resolutions'::regclass AND conname = 'ck_phytochem_taxon_resolution_independent_review'")"
          test "$audit_schema_check" = "t"
          test "$audit_fk_check" = "t"
          test "$audit_constraint_check" = "t"

          # A valid literature record is accepted by the relational schema.
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci <<'SQL'
          INSERT INTO phytochem_candidates DEFAULT VALUES RETURNING id AS candidate_id \gset
          INSERT INTO phytochem_taxon_resolutions(
              candidate_id, requested_name, provider, checklist_key, dataset_doi,
              dataset_version, source_url, response_sha256
          ) VALUES (
              :candidate_id, 'Coffea arabica', 'GBIF ChecklistBank Species Match API v2 / WCVP',
              'f382f0ce-323a-4091-bb9f-add557f3a9a2', '10.15468/6h8ucr',
              'WCVP v16 (2026-06-04)', 'https://api.gbif.org/v2/species/match',
              repeat('a', 64)
          ) RETURNING id AS taxon_resolution_id \gset
          INSERT INTO phytochem_occurrence_evidence(
              candidate_id, taxon_resolution_id, evidence_type, plant_part,
              source_reference, evidence_statement, evidence_sha256
          ) VALUES (
              :candidate_id, :taxon_resolution_id, 'literature_report', 'leaves',
              'https://doi.org/10.1234/example',
              'A primary source reports this plant-compound occurrence.',
              repeat('b', 64)
          );
          SQL
          test "$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT review_status || ':' || evidence_type FROM phytochem_occurrence_evidence WHERE evidence_type = 'literature_report' ORDER BY id DESC LIMIT 1")" = "pending_review:literature_report"

          # Database-level independent-review constraint must reject self-review.
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci <<'SQL'
          DO $audit$
          DECLARE
              user_key INT;
              resolution_key INT;
              error_state TEXT;
              error_constraint TEXT;
          BEGIN
              INSERT INTO users DEFAULT VALUES RETURNING id INTO user_key;
              SELECT id INTO resolution_key
                FROM phytochem_taxon_resolutions
                WHERE candidate_id IS NOT NULL
                ORDER BY id DESC LIMIT 1;
              UPDATE phytochem_taxon_resolutions
                 SET created_by = user_key, reviewed_by_user_id = user_key
               WHERE id = resolution_key;
              RAISE EXCEPTION USING
                  ERRCODE = 'P0001',
                  MESSAGE = 'Taxonomic self-review was unexpectedly accepted';
          EXCEPTION WHEN check_violation THEN
              GET STACKED DIAGNOSTICS
                  error_state = RETURNED_SQLSTATE,
                  error_constraint = CONSTRAINT_NAME;
              IF error_state <> '23514'
                 OR error_constraint <> 'ck_phytochem_taxon_resolution_independent_review' THEN
                  RAISE EXCEPTION 'Unexpected audit constraint failure: state %, constraint %',
                      error_state, error_constraint;
              END IF;
          END;
          $audit$;
          SQL

          # An LC-MS/MS claim with a valid specimen but missing annotation/sample
          # must be rejected by the specific lineage CHECK constraint.
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci <<'SQL'
          DO $phyto$
          DECLARE
              specimen_key INT;
              candidate_key INT;
              resolution_key INT;
              error_state TEXT;
              error_constraint TEXT;
              error_message TEXT;
          BEGIN
              INSERT INTO botanical_specimens DEFAULT VALUES
              RETURNING id INTO specimen_key;

              SELECT candidate_id, taxon_resolution_id
                INTO candidate_key, resolution_key
              FROM phytochem_occurrence_evidence
              WHERE evidence_type = 'literature_report'
              ORDER BY id DESC
              LIMIT 1;

              BEGIN
                  INSERT INTO phytochem_occurrence_evidence(
                      candidate_id, taxon_resolution_id, specimen_id, evidence_type,
                      plant_part, source_reference, evidence_statement, evidence_sha256
                  ) VALUES (
                      candidate_key, resolution_key, specimen_key, 'lcms_annotation',
                      'leaves', 'NEXORA-LCMS-ANNOTATION:missing',
                      'Invalid LC-MS evidence without an annotation or sample.',
                      repeat('c', 64)
                  );
                  RAISE EXCEPTION USING
                      ERRCODE = 'P0001',
                      MESSAGE = 'Incomplete LC-MS/MS occurrence evidence was unexpectedly accepted';
              EXCEPTION WHEN OTHERS THEN
                  GET STACKED DIAGNOSTICS
                      error_state = RETURNED_SQLSTATE,
                      error_constraint = CONSTRAINT_NAME,
                      error_message = MESSAGE_TEXT;
                  IF error_state <> '23514' THEN
                      RAISE EXCEPTION 'Expected CHECK violation 23514; got state %, constraint %, message %',
                          error_state, error_constraint, error_message;
                  END IF;
                  IF error_constraint <> 'ck_phytochem_occurrence_lcms_lineage' THEN
                      RAISE EXCEPTION 'Expected ck_phytochem_occurrence_lcms_lineage; got constraint %, message %',
                          error_constraint, error_message;
                  END IF;
                  RAISE NOTICE 'Expected constraint % rejected the incomplete LC-MS/MS record.',
                      error_constraint;
              END;
          END;
          $phyto$;
          SQL
          echo "PhytoEvidence migrations 014/016, idempotence, independent curation and occurrence constraints passed."

      - name: Validate Research evidence independent-review migration 017
        run: |
          set -euo pipefail
          container=nexora-research-evidence-017-postgres
          docker run --detach --name "$container" \
            -e POSTGRES_PASSWORD=ci-only-password \
            -e POSTGRES_DB=nexora_ci \
            postgres:16-alpine
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if docker exec "$container" pg_isready -U postgres -d nexora_ci; then break; fi
            sleep 2
          done
          docker exec "$container" pg_isready -U postgres -d nexora_ci

          cat > /tmp/research-evidence-prerequisites.sql <<'SQL'
          CREATE TABLE users (id SERIAL PRIMARY KEY);
          CREATE TABLE research_studies (id SERIAL PRIMARY KEY);
          CREATE TABLE research_evidence (
              id SERIAL PRIMARY KEY,
              study_id INT NOT NULL REFERENCES research_studies(id) ON DELETE CASCADE,
              created_by INT REFERENCES users(id) ON DELETE SET NULL,
              evidence_status VARCHAR(40) NOT NULL
          );
          INSERT INTO users DEFAULT VALUES;
          INSERT INTO users DEFAULT VALUES;
          INSERT INTO research_studies DEFAULT VALUES;
          INSERT INTO research_evidence(study_id, created_by, evidence_status)
          VALUES (1, 1, 'experimentally_validated');
          SQL
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < /tmp/research-evidence-prerequisites.sql

          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/017_research_evidence_independent_review.sql
          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci < infra/postgres/migrations/017_research_evidence_independent_review.sql

          test "$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT review_status FROM research_evidence WHERE id = 1")" = "pending_review"
          self_review_check="$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT COUNT(*) = 1 FROM pg_constraint WHERE conname = 'ck_research_evidence_independent_review' AND conrelid = 'research_evidence'::regclass")"
          attribution_check="$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT COUNT(*) = 1 FROM pg_constraint WHERE conname = 'ck_research_evidence_review_attribution' AND conrelid = 'research_evidence'::regclass")"
          test "$self_review_check" = "t"
          test "$attribution_check" = "t"

          docker exec -i "$container" psql -v ON_ERROR_STOP=1 -U postgres -d nexora_ci <<'SQL'
          DO $review$
          DECLARE
              error_state TEXT;
              error_constraint TEXT;
          BEGIN
              UPDATE research_evidence
                 SET review_status = 'accepted', reviewed_by = 1, reviewed_at = now()
               WHERE id = 1;
              RAISE EXCEPTION USING
                  ERRCODE = 'P0001',
                  MESSAGE = 'Research evidence self-review was unexpectedly accepted';
          EXCEPTION WHEN check_violation THEN
              GET STACKED DIAGNOSTICS
                  error_state = RETURNED_SQLSTATE,
                  error_constraint = CONSTRAINT_NAME;
              IF error_state <> '23514'
                 OR error_constraint <> 'ck_research_evidence_independent_review' THEN
                  RAISE EXCEPTION 'Unexpected independent-review constraint failure: state %, constraint %',
                      error_state, error_constraint;
              END IF;
          END;
          $review$;
          UPDATE research_evidence
             SET review_status = 'accepted', reviewed_by = 2,
                 reviewed_at = now(), review_reason = 'Independent scientific evidence review.'
           WHERE id = 1;
          SQL

          test "$(docker exec "$container" psql -At -U postgres -d nexora_ci -c "SELECT review_status || ':' || (reviewed_by = 2)::text FROM research_evidence WHERE id = 1")" = "accepted:true"
          echo "Research evidence review migration 017, replay, independent-review and attribution constraints passed."

  lcmsms-engine-tests:
    runs-on: ubuntu-latest
    env:
      APP_NAME: N3XORA LCMS CI
      APP_VERSION: 2.0.0
      DEBUG: "true"
      DATABASE_URL: sqlite:///./ci_lcmsms.db
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
      SECRET_KEY: ci-only-secret-key-with-more-than-32-characters-2026
      ADMIN_EMAIL: ci-admin@nexora.test
      AFRICAN_LIBS_DIR: /tmp/n3xora-african-libs
      OFFLINE_PACKAGES_DIR: /tmp/n3xora-offline-packages
      STORAGE_DIR: /tmp/n3xora-storage
      UPLOAD_DIR: /tmp/n3xora-storage/uploads
      RESULTS_DIR: /tmp/n3xora-storage/results
      TEMP_DIR: /tmp/n3xora-storage/temp
      LCMS_STORAGE_DIR: /tmp/n3xora-lcms-storage
      AMRFINDER_REQUIRED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lcmsms.txt

      - name: Install isolated LC-MS/MS requirements
        run: python -m pip install --upgrade pip && pip install -r backend/requirements-lcmsms.txt

      - name: Run LC-MS/MS algorithm tests
        run: pytest -q backend/tests/test_lcmsms_engine.py
