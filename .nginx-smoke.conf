pid /tmp/n3xora-nginx.pid;
events {}
http {
server {
    listen 18080;
    server_name _;

    # IMPORTANT: define the document root at server scope so every
    # frontend location, including the exact '/' location, uses the
    # mounted Docker frontend directory.
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Root must resolve to the real frontend entry point.
    location = / {
        try_files /index.html =404;
    }

    # Frontend assets and SPA pages. Do not expose directory listings.
    # Existing files are served; unknown application routes fall back to
    # index.html. A request to a real directory without an index remains
    # a deliberate 403/404 and is not an authentication failure.
    location / {
        try_files $uri @n3xora_spa;
        add_header Cache-Control "public, max-age=3600";
    }

    location @n3xora_spa {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # FastAPI reverse proxy. Preserve the complete /api/v1/... URI.
    # Never replace upstream API errors with nginx-generated HTML.
    location /api/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_intercept_errors off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:18081/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
    }
}

}
